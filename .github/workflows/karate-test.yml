
name: Regresion automatizada Karate

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  karate-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      
      - name: Instalar Chrome y ChromeDriver compatibles
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true


      
      - name: Ejecutar regresion Karate
        env:
          STORE_USER: ${{ secrets.STORE_USER }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          DRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mvn -B clean test \
            -Dci=true \
            -Dwebdriver.path="$DRIVER_PATH" \
            -Dchrome.path="$CHROME_PATH" \
            -Dstore.user="$STORE_USER" \
            -Dstore.password="$STORE_PASSWORD"

      - name: Guardar reportes y evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-karate
          path: |
            target/karate-reports/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30
